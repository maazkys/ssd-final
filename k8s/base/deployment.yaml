# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Manifests — CYC386 MVP
# Security: Pod Security Standards (Restricted), Network Policies, RBAC
# CIS Kubernetes Benchmark sections: 5.1, 5.2, 5.7
# ─────────────────────────────────────────────────────────────────────────────

---
# 1. Namespace with Pod Security Standards enforcement
apiVersion: v1
kind: Namespace
metadata:
  name: secureapp
  labels:
    # CIS 5.2 — Enforce restricted pod security standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# 2. ServiceAccount (dedicated, no automount of token)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureapp-sa
  namespace: secureapp
automountServiceAccountToken: false  # CIS 5.1.6

---
# 3. RBAC — minimal permissions for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secureapp-role
  namespace: secureapp
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]   # Read-only config access only

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secureapp-rolebinding
  namespace: secureapp
subjects:
  - kind: ServiceAccount
    name: secureapp-sa
roleRef:
  kind: Role
  name: secureapp-role
  apiGroup: rbac.authorization.k8s.io

---
# 4. Secret for JWT key (in prod: use HashiCorp Vault CSI driver)
apiVersion: v1
kind: Secret
metadata:
  name: secureapp-secrets
  namespace: secureapp
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_WITH_VAULT_SECRET"
  DB_PASSWORD: "REPLACE_WITH_VAULT_SECRET"
  REDIS_PASSWORD: "REPLACE_WITH_VAULT_SECRET"

---
# 5. Deployment — hardened pod spec
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureapp
  namespace: secureapp
  labels:
    app: secureapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureapp
  template:
    metadata:
      labels:
        app: secureapp
    spec:
      serviceAccountName: secureapp-sa

      # CIS 5.7.1 — Do not run as root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault  # CIS 5.7.2

      containers:
        - name: secureapp
          image: secureapp-mvp:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              protocol: TCP

          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secureapp-secrets
                  key: JWT_SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secureapp-secrets
                  key: DB_PASSWORD

          # CIS 5.1.3 — Resource limits (prevent DoS)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # CIS 5.2.x — Container security context
          securityContext:
            allowPrivilegeEscalation: false  # CIS 5.2.5
            readOnlyRootFilesystem: true      # CIS 5.2.4
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL                          # CIS 5.2.7
              add:
                - NET_BIND_SERVICE

          # Liveness & Readiness probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}

      # Do not mount default service account token
      automountServiceAccountToken: false

---
# 6. Service
apiVersion: v1
kind: Service
metadata:
  name: secureapp-svc
  namespace: secureapp
spec:
  selector:
    app: secureapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# 7. Network Policy — Zero Trust networking (deny-all default, then whitelist)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secureapp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-secureapp-ingress
  namespace: secureapp
spec:
  podSelector:
    matchLabels:
      app: secureapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# 8. HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureapp-hpa
  namespace: secureapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureapp
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CYC386 MVP Stack: App + Postgres + Redis + Prometheus + Grafana + Falco
# ─────────────────────────────────────────────────────────────────────────────

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # No direct internet access for internal services

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

services:

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: secureapp-mvp:latest
    container_name: secureapp
    restart: unless-stopped
    networks: [frontend, backend]
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://secureapp:${DB_PASSWORD}@postgres:5432/secureapp
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # CIS Docker Benchmark: 5.11 — read-only root FS
    read_only: true
    tmpfs:
      - /tmp
    # CIS 5.10 — Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # CIS 5.25 — Restrict container from gaining new privileges
    security_opt:
      - no-new-privileges:true
    # CIS 5.12 — Prevent privileged escalation
    user: "1001:1001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: secureapp
      POSTGRES_USER: secureapp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (hardened) ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks: [backend]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
      --protected-mode yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command CONFIG ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    networks: [frontend, backend]
    ports:
      - "9090:9090"
    volumes:
      - ../monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    networks: [frontend]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitor/grafana/provisioning:/etc/grafana/provisioning:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Falco (Runtime Security) ─────────────────────────────────────────────────
  falco:
    image: falcosecurity/falco:0.37.1
    container_name: falco
    restart: unless-stopped
    networks: [backend]
    privileged: true   # Required for kernel-level monitoring
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - ../monitor/falco/falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
    environment:
      - FALCO_GRPC_ENABLED=true

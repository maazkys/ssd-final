name: DevSecOps Pipeline — CYC386 MVP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: secureapp-mvp
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ── Job 1: SAST — Static Application Security Testing ──────────────────────
  sast:
    name: SAST (Bandit + CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit (Python SAST)
        run: pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: |
          bandit -r src/ \
            -f json \
            -o reports/bandit-report.json \
            --severity-level medium \
            --confidence-level medium || true
          bandit -r src/ --severity-level high --exit-zero

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: reports/codeql-results

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/

  # ── Job 2: Dependency Scanning ──────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Safety
        run: pip install safety

      - name: Run Safety dependency check
        run: |
          safety check \
            --file src/requirements.txt \
            --json \
            --output reports/safety-report.json || true

      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: reports/safety-report.json

  # ── Job 3: Build & Container Scan ──────────────────────────────────────────
  build-and-scan:
    name: Build Docker Image & Trivy Scan
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: reports/trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1       # Fail pipeline on CRITICAL/HIGH CVEs

      - name: Run Trivy config scan (Dockerfile/K8s manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/trivy-results.sarif

  # ── Job 4: DAST — Dynamic Application Security Testing ─────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - uses: actions/checkout@v4

      - name: Start application for DAST
        run: |
          pip install -r src/requirements.txt
          JWT_SECRET_KEY=test-secret-for-ci \
          DATABASE_URL=sqlite+aiosqlite:///./test.db \
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "http://localhost:8000/api/openapi.json"
          format: openapi
          cmd_options: "-a"
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  # ── Job 5: Push to Registry (main branch only) ─────────────────────────────
  push:
    name: Push to Container Registry
    runs-on: ubuntu-latest
    needs: [build-and-scan, dast]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image digest
        run: echo "Pushed image with digest"
